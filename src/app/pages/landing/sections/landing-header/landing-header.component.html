<header
  class="sticky top-0 z-50 w-full border-b border-[#eef1f6] bg-white/85 backdrop-blur-[10px] dark:border-gray-800 dark:bg-gray-900/85"
>
  <div class="ef-container flex h-13.5 items-center gap-3 md:h-14.5 md:gap-3.5 lg:h-15.5 lg:gap-5">
    <!-- Brand -->
    <a routerLink="/" aria-label="EngageFlow AI home" class="shrink-0">
      <app-logo variant="landing" />
    </a>

    <!-- Desktop / tablet center nav -->
    <nav class="mx-auto hidden items-center gap-4.5 md:flex lg:gap-6" aria-label="Primary">
      @for (link of navLinks; track link.label) {
        <a
          [routerLink]="link.route"
          routerLinkActive="font-semibold! text-brand-500! dark:text-brand-400!"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          class="font-medium text-[13px] text-gray-700 transition-colors hover:text-brand-500 lg:text-[13.5px] dark:text-gray-300 dark:hover:text-brand-400"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Sign In: desktop only (reference tablet nav has just Get Started) -->
    <a
      routerLink="/signin"
      class="hidden font-semibold text-[13px] text-gray-700 transition-colors hover:text-brand-500 lg:inline-flex lg:text-[13.5px] dark:text-gray-300 dark:hover:text-brand-400"
    >
      Sign In
    </a>
    <a
      routerLink="/signup"
      class="grad-btn hidden text-[13px] md:inline-flex md:[padding:8px_16px] lg:text-[13.5px] lg:[padding:9px_18px]"
      style="border-radius: 10px"
    >
      Get Started
    </a>

    <!-- Mobile hamburger -->
    <button
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="lp-mobile-menu"
      aria-label="Toggle navigation menu"
      class="ml-auto grid h-9 w-9 shrink-0 place-items-center rounded-[10px] border border-[#e3e6eb] text-gray-700 md:hidden dark:border-gray-700 dark:text-gray-300"
    >
      @if (mobileMenuOpen()) {
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 18 18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
      }
    </button>
  </div>

  <!-- Mobile dropdown -->
  @if (mobileMenuOpen()) {
    <div
      id="lp-mobile-menu"
      class="border-t border-[#eef1f6] bg-white px-4 py-4 md:hidden dark:border-gray-800 dark:bg-gray-900"
    >
      <nav class="flex flex-col gap-1">
        @for (link of navLinks; track link.label) {
          <a
            [routerLink]="link.route"
            routerLinkActive="bg-brand-50 text-brand-600! dark:bg-brand-500/10 dark:text-brand-400!"
            [routerLinkActiveOptions]="{ exact: !!link.exact }"
            (click)="closeMobileMenu()"
            class="rounded-lg px-3 py-3 text-[14px] font-medium text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-white/5"
          >
            {{ link.label }}
          </a>
        }
        <div class="mt-2 flex flex-col gap-2 border-t border-[#eef1f6] pt-3 dark:border-gray-800">
          <a
            routerLink="/signin"
            (click)="closeMobileMenu()"
            class="rounded-[10px] border border-[#ccdcf1] bg-white px-4 py-2.5 text-center text-[13.5px] font-semibold text-[#1a5dab] dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
          >
            Sign In
          </a>
          <a
            routerLink="/signup"
            (click)="closeMobileMenu()"
            class="grad-btn text-[13.5px]"
            style="border-radius: 10px; padding: 10px 18px"
          >
            Get Started
          </a>
        </div>
      </nav>
    </div>
  }
</header>
