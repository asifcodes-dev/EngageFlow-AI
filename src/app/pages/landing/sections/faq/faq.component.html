<section id="faq" class="ef-section scroll-mt-20">
  <div class="ef-container-sm">
    <div class="ef-section-head">
      <span class="ef-eyebrow">FAQ</span>
      <h2 class="ef-heading">Frequently asked questions</h2>
      <p class="ef-subheading">Everything you need to know before you start.</p>
    </div>

    <div class="ef-card mt-12 divide-y divide-gray-200 overflow-hidden dark:divide-gray-800">
      @for (faq of faqs; track faq.question; let i = $index) {
        <div>
          <button
            type="button"
            (click)="toggle(i)"
            [attr.aria-expanded]="isOpen(i)"
            class="flex w-full items-center justify-between gap-4 px-5 py-5 text-left transition hover:bg-gray-50 sm:px-6 dark:hover:bg-white/5"
          >
            <span class="text-base font-medium text-gray-900 dark:text-white">{{
              faq.question
            }}</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              class="h-5 w-5 shrink-0 text-gray-400 transition-transform duration-200"
              [class.rotate-180]="isOpen(i)"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </button>
          @if (isOpen(i)) {
            <div class="px-5 pb-5 sm:px-6">
              <p class="text-sm leading-6 text-gray-600 dark:text-gray-400">{{ faq.answer }}</p>
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
