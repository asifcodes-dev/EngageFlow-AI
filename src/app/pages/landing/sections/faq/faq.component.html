<section id="faq" class="ef-section scroll-mt-20">
  <div class="ef-container-sm">
    <div class="ef-section-head">
      <span class="ef-eyebrow">FAQ</span>
      <h2 class="ef-heading">Questions? <span class="ef-gradient-text">Answers!</span></h2>
      <p class="ef-subheading">Everything you need to know before you start.</p>
    </div>

    <div class="mt-12 space-y-3">
      @for (faq of faqs; track faq.question; let i = $index) {
        <div
          class="ef-card overflow-hidden transition"
          [class.ring-1]="isOpen(i)"
          [class.ring-brand-500]="isOpen(i)"
        >
          <button
            type="button"
            (click)="toggle(i)"
            [attr.aria-expanded]="isOpen(i)"
            class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left sm:px-6"
          >
            <span class="text-sm font-medium text-gray-900 sm:text-base dark:text-white">
              {{ faq.question }}
            </span>
            <span
              class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-500 dark:bg-brand-500/15 dark:text-brand-400"
            >
              @if (isOpen(i)) {
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="h-4 w-4"
                  aria-hidden="true"
                >
                  <path stroke-linecap="round" d="M5 12h14" />
                </svg>
              } @else {
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="h-4 w-4"
                  aria-hidden="true"
                >
                  <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                </svg>
              }
            </span>
          </button>
          @if (isOpen(i)) {
            <div class="px-5 pb-5 sm:px-6">
              <p class="text-sm leading-6 text-gray-600 dark:text-gray-400">{{ faq.answer }}</p>
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
