<div class="ef-container -mt-6 pb-12 sm:-mt-8 sm:pb-16">
  <div class="ef-card grid grid-cols-2 gap-5 p-6 shadow-theme-sm sm:grid-cols-4 sm:gap-4 sm:p-8">
    @for (stat of stats; track stat.label) {
      <div class="flex flex-col items-center gap-2 text-center sm:flex-row sm:gap-3 sm:text-left">
        <span
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
          [ngClass]="stat.color"
          [innerHTML]="stat.icon | safeHtml"
        ></span>
        <span>
          <span class="block text-xl font-bold text-gray-900 sm:text-2xl dark:text-white">
            {{ stat.value }}
          </span>
          <span class="block text-xs text-gray-500 dark:text-gray-400">{{ stat.label }}</span>
        </span>
      </div>
    }
  </div>
</div>
