<!-- Trusted marquee band (constant brand pastel gradient across themes) -->
<div
  class="relative overflow-hidden border-t border-b border-[#dbe6f6] py-4 text-center lg:py-6"
  style="background: linear-gradient(120deg, #e3eefc 0%, #f2f8ff 45%, #dceafc 100%)"
>
  <!-- floating blur blob (desktop only, per reference) -->
  <span
    class="au-blob hidden lg:block"
    style="
      width: 260px;
      height: 260px;
      top: -120px;
      left: 10%;
      background: rgba(36, 112, 200, 0.14);
      filter: blur(60px);
    "
    aria-hidden="true"
  ></span>

  <!-- gradient eyebrow (brand gradient stays constant across themes) -->
  <div
    class="mb-3 px-4 text-[9.5px] font-bold tracking-[0.14em] text-transparent uppercase md:mb-3.5 md:px-0 md:text-[11px] lg:mb-4 lg:text-xs"
    style="
      background: linear-gradient(120deg, #2470c8, #16467f);
      -webkit-background-clip: text;
      background-clip: text;
    "
  >
    Trusted by creators &amp; brands growing on Instagram
  </div>

  <!-- auto-scrolling marquee (reduced-motion falls back to swipe scroll) -->
  <div class="ef-marquee-viewport" aria-label="Example Instagram creator &amp; brand profiles">
    <!-- No flex `gap` / leading padding: the trailing gap lives on each card (mr-*)
         so the two identical sets tile exactly and the -50% loop is seamless. -->
    <div class="ef-marquee-track [--ef-marquee-duration:95s] md:[--ef-marquee-duration:80s]">
      @for (p of loop; track $index) {
        <ng-container [ngTemplateOutlet]="card" [ngTemplateOutletContext]="{ $implicit: p }" />
      }
      <!-- identical second half for the seamless -50% loop (no gap on wide screens) -->
      @for (p of loop; track $index) {
        <ng-container
          [ngTemplateOutlet]="card"
          [ngTemplateOutletContext]="{ $implicit: p, dup: true }"
        />
      }
    </div>
  </div>
</div>

<!-- reusable follower card -->
<ng-template #card let-p let-dup="dup">
  <div
    class="lift mr-3 w-[172px] shrink-0 rounded-[13px] border border-white p-3 text-left md:mr-3.5 md:w-[190px] md:rounded-[14px] md:p-3.5 lg:mr-4"
    style="
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px -14px rgba(26, 93, 171, 0.4);
    "
    [attr.aria-hidden]="dup ? 'true' : null"
  >
    <!-- header: gradient ring avatar + handle -->
    <div class="flex items-center gap-2.25">
      <span
        class="block size-[34px] shrink-0 rounded-full p-0.5 md:size-9"
        style="background: linear-gradient(135deg, #2470c8, #16467f)"
        aria-hidden="true"
      >
        <span
          class="grid h-full w-full place-items-center rounded-full bg-white text-[11px] font-extrabold text-[#1a5dab]"
        >
          {{ p.initials }}
        </span>
      </span>
      <div class="min-w-0">
        <div class="truncate text-xs font-bold text-[#171717]">{{ p.handle }}</div>
        <div class="text-[10px] text-[#6b7280]">{{ p.niche }}</div>
      </div>
    </div>

    <!-- follower / post counts -->
    <div class="mt-2.5 flex justify-between text-[10px] text-[#6b7280] md:text-[10.5px]">
      <span
        ><b class="text-[#171717]">{{ p.followers }}</b> followers</span
      >
      <span
        ><b class="text-[#171717]">{{ p.posts }}</b> posts</span
      >
    </div>

    <!-- following pill (brand gradient stays constant) -->
    <span
      class="mt-2.5 flex items-center justify-center rounded-lg p-1.5 text-[10px] font-bold text-white md:text-[10.5px]"
      style="background: linear-gradient(120deg, #2470c8, #16467f)"
      >Following</span
    >
  </div>
</ng-template>
