<section id="how-it-works" class="ef-section scroll-mt-20">
  <div class="ef-container">
    <div class="ef-section-head">
      <span class="ef-eyebrow">Easy 3-step setup</span>
      <h2 class="ef-heading">Pick, create, and <span class="ef-gradient-text">scale</span></h2>
      <p class="ef-subheading">
        EngageFlow AI simplifies your growth workflow — zero technical hurdles, just automated
        results.
      </p>
    </div>

    <div class="relative mt-12 sm:mt-16">
      <!-- connector line (lg) -->
      <div
        aria-hidden="true"
        class="absolute top-1.5 right-[16.66%] left-[16.66%] hidden border-t-2 border-dashed border-gray-200 lg:block dark:border-gray-700"
      ></div>

      <div class="grid grid-cols-3 gap-3 sm:gap-6">
        @for (step of steps; track step.number; let i = $index) {
          <div>
            <!-- dot on the connector (lg) -->
            <div
              class="mx-auto mb-5 hidden h-3 w-3 rounded-full lg:block"
              [ngClass]="i === 1 ? 'bg-theme-purple-500' : 'bg-brand-500'"
            ></div>

            <div
              class="h-full rounded-2xl border p-4 text-center sm:p-6"
              [ngClass]="
                i === 1
                  ? 'border-brand-500 bg-brand-50/60 shadow-theme-md dark:border-brand-500 dark:bg-brand-500/10'
                  : 'border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-800'
              "
            >
              <span
                class="mx-auto flex h-11 w-11 items-center justify-center rounded-xl sm:h-12 sm:w-12"
                [ngClass]="
                  i === 1
                    ? 'bg-brand-500 text-white'
                    : 'bg-brand-50 text-brand-500 dark:bg-brand-500/15 dark:text-brand-400'
                "
                [innerHTML]="step.icon | safeHtml"
              ></span>
              <p
                class="mt-3 text-[10px] font-bold tracking-wide text-gray-400 uppercase sm:text-xs"
              >
                Phase {{ step.number }}
              </p>
              <h3 class="mt-1 text-sm font-semibold text-gray-900 sm:text-lg dark:text-white">
                {{ step.title }}
              </h3>
              <p
                class="mt-1.5 text-xs leading-5 text-gray-600 sm:text-sm sm:leading-6 dark:text-gray-400"
              >
                {{ step.description }}
              </p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
