<select
  class="au-input au-select {{ value ? '' : 'text-[#9aa1ab]' }} {{ className }}"
  [value]="value"
  (change)="onChange($event)"
>
  <!-- Placeholder option -->
  <option value="" disabled [selected]="!value">
    {{ placeholder }}
  </option>
  <!-- Map over options -->
  @for (option of options; track $index) {
    <option [value]="option.value">
      {{ option.label }}
    </option>
  }
</select>
