<div class="mx-auto mt-10 w-full max-w-100 lg:mt-20">
  <!-- Lock chip (reference Forgot artboard) -->
  <span class="au-chip au-chip-blue h-12 w-12 rounded-[14px]">
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="4" y="11" width="16" height="10" rx="2" />
      <path d="M8 11V7a4 4 0 0 1 8 0v4" />
    </svg>
  </span>

  <h1 class="mt-4.5 text-[32px] font-bold tracking-[-0.02em] text-gray-800 dark:text-white/90">
    Forgot your password?
  </h1>
  <p class="mt-2.5 text-sm" style="color: var(--au-muted)">
    Enter the email you signed up with and we'll send you a link to reset it.
  </p>

  @if (sent) {
    <div
      class="mt-6 rounded-xl border px-4 py-3.5 text-sm font-medium"
      style="border-color: #bfe6cf; background: #e8f8ef; color: #2d7a4f"
    >
      If an account exists for {{ email }}, a reset link is on its way. Check your inbox (and spam
      folder).
    </div>
  } @else {
    @if (error) {
      <div
        class="mt-5 rounded-xl border px-4 py-3 text-sm font-medium"
        style="border-color: #f0cbc5; background: #fbebe8; color: #b3402f"
        role="alert"
      >
        {{ error }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="mt-6">
      <app-label>Email <span class="text-brand-500">*</span></app-label>
      <app-input-field
        type="email"
        placeholder="you@business.com"
        [(value)]="email"
        name="email"
        [error]="!!emailError"
        [hint]="emailError"
        className="h-11.5!"
      />

      <button
        type="submit"
        class="grad-btn mt-5 flex h-12 w-full items-center justify-center rounded-xl text-[15px]"
        [class.opacity-70]="loading"
        [disabled]="loading"
      >
        {{ loading ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>
  }

  <div class="mt-4.5 text-center text-[13px]" style="color: var(--au-muted)">
    Remember your password?
    <a routerLink="/signin" class="font-semibold text-brand-500 dark:text-brand-300">Sign In</a>
  </div>
</div>
