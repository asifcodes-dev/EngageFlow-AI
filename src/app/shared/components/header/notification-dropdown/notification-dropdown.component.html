<div class="relative">
  <button
    class="relative grid h-8.5 w-8.5 place-items-center rounded-[14px] bg-white/12 text-white transition-colors dropdown-toggle hover:bg-white/22"
    (click)="toggleDropdown()"
    aria-label="Notifications"
  >
    <span
      class="au-pulse-dot absolute right-2 top-2 z-10 h-[7px] w-[7px] rounded-full border-[1.5px] border-brand-500 bg-[#7fd1a2]"
      [ngClass]="{ hidden: !notifying, block: notifying }"
    ></span>
    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
    </svg>
  </button>
  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute -right-[240px] mt-[17px] flex w-[350px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark sm:w-[361px] lg:right-0"
  >
    <div
      class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100 dark:border-gray-700"
    >
      <h5 class="text-lg font-semibold text-gray-800 dark:text-gray-200">Notifications</h5>
      <button
        (click)="toggleDropdown()"
        class="text-gray-500 transition dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200"
        aria-label="Close notifications"
      >
        <svg
          class="fill-current"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M6.21967 7.28131C5.92678 6.98841 5.92678 6.51354 6.21967 6.22065C6.51256 5.92775 6.98744 5.92775 7.28033 6.22065L11.999 10.9393L16.7176 6.22078C17.0105 5.92789 17.4854 5.92788 17.7782 6.22078C18.0711 6.51367 18.0711 6.98855 17.7782 7.28144L13.0597 12L17.7782 16.7186C18.0711 17.0115 18.0711 17.4863 17.7782 17.7792C17.4854 18.0721 17.0105 18.0721 16.7176 17.7792L11.999 13.0607L7.28033 17.7794C6.98744 18.0722 6.51256 18.0722 6.21967 17.7794C5.92678 17.4865 5.92678 17.0116 6.21967 16.7187L10.9384 12L6.21967 7.28131Z"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>

    <!-- No notifications backend yet: show an empty state instead of demo data. -->
    <div class="flex flex-col items-center justify-center px-4 py-12 text-center">
      <span class="text-sm font-medium text-gray-700 dark:text-gray-300">You're all caught up</span>
      <span class="mt-1 text-theme-xs text-gray-500 dark:text-gray-400">
        New notifications will appear here.
      </span>
    </div>
  </app-dropdown>
</div>
