<div class="au-card {{ className }}">
  <!-- Card Header -->
  <div class="px-5 py-4">
    <h3 class="text-base font-bold text-gray-800 dark:text-white/90">{{ title }}</h3>
    @if (desc) {
      <p class="mt-0.5 text-sm" style="color: var(--au-muted)">{{ desc }}</p>
    }
  </div>

  <!-- Card Body -->
  <div class="border-t px-5 py-5" style="border-color: var(--au-row-line)">
    <ng-content></ng-content>
  </div>
</div>
