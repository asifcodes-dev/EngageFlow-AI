<div class="au-canvas flex min-h-screen items-center justify-center p-4 sm:p-6">
  <div
    class="flex w-full max-w-275 flex-col overflow-hidden rounded-2xl border bg-(--au-surface) shadow-[0_16px_40px_-20px_rgba(23,23,23,0.22)] lg:flex-row"
    style="border-color: var(--au-line)"
  >
    <!-- Mobile: brand panel stacks on top (reference mobile artboards) -->
    <div
      class="relative flex flex-col items-center px-6 py-7 text-center text-white lg:hidden"
      style="
        background: radial-gradient(120% 120% at 70% 20%, #232159, #14143a 60%, #0f1030);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size:
          100% 100%,
          48px 48px,
          48px 48px;
      "
    >
      <a routerLink="/" aria-label="EngageFlow AI home">
        <app-logo variant="auth" />
      </a>
      <p class="mt-3 max-w-xs text-sm font-semibold text-white/90">{{ tagline }}</p>
    </div>

    <!-- Form pane -->
    <div class="flex-1 px-6 pb-10 pt-6 sm:px-12 sm:pt-8.5">
      <a [routerLink]="backLink" class="au-back-pill">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
        {{ backLabel }}
      </a>
      <ng-content></ng-content>
    </div>

    <!-- Brand / value panel (desktop) -->
    <div
      class="relative hidden w-120 shrink-0 flex-col items-center justify-center overflow-hidden p-10 text-white lg:flex"
      style="
        background: radial-gradient(120% 120% at 70% 20%, #232159, #14143a 60%, #0f1030);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size:
          100% 100%,
          48px 48px,
          48px 48px;
      "
    >
      <app-grid-shape />
      <div class="z-1 flex flex-col items-center text-center">
        <a routerLink="/" aria-label="EngageFlow AI home">
          <app-logo variant="auth" />
        </a>
        <div class="mt-7 max-w-80 text-lg font-bold">{{ tagline }}</div>
        <ng-content select="[brandPanel]"></ng-content>
      </div>

      <!-- Theme FAB (dark mode kept; reference: 44px #3b5bdb moon, bottom-right) -->
      <div class="absolute bottom-5 right-5 z-1">
        <app-theme-toggle-two />
      </div>
    </div>
  </div>

  <!-- Mobile/tablet theme FAB (panel is stacked, so pin to viewport) -->
  <div class="fixed bottom-5 right-5 z-50 lg:hidden">
    <app-theme-toggle-two />
  </div>
</div>
