<header class="au-topbar fixed inset-x-0 top-0 z-40 flex h-14 items-center gap-4 px-4 md:px-6">
  <!-- Hamburger (tablet + mobile — opens the sidebar drawer) -->
  <button
    type="button"
    (click)="toggleMobile()"
    class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-white/90 transition hover:bg-white/15 xl:hidden"
    aria-label="Toggle menu"
  >
    @if (isMobileOpen$ | async) {
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    } @else {
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M4 6h16M4 12h16M4 18h10" />
      </svg>
    }
  </button>

  <!-- Logo + admin badge -->
  <a
    routerLink="/dashboard"
    class="flex shrink-0 items-center gap-2.5"
    aria-label="EngageFlow AI home"
  >
    <app-logo variant="topbar" />
    @if (isAdminRoute$ | async) {
      <span
        class="hidden rounded-md bg-white/20 px-2 py-[3px] text-[10px] font-bold uppercase tracking-[0.08em] text-white sm:inline"
      >
        Admin
      </span>
    }
  </a>

  <!-- Command search (desktop/tablet) -->
  <div class="relative mx-auto hidden w-full max-w-[520px] md:block">
    <svg
      class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-white/80"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <input
      #searchInput
      type="text"
      placeholder="Search or type a command…"
      class="au-search-blue"
      aria-label="Search"
    />
    <span
      class="absolute right-2.5 top-1/2 hidden -translate-y-1/2 rounded-md border border-white/35 px-1.5 py-0.5 text-[11px] font-semibold text-white/85 xl:inline"
    >
      ⌘K
    </span>
  </div>

  <!-- Right cluster -->
  <div class="ml-auto flex items-center gap-2 md:gap-3">
    <app-theme-toggle-button />
    <app-notification-dropdown />
    <app-user-dropdown />
  </div>
</header>
